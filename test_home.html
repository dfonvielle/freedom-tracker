<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freedom-home — mock harness</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 0; background: #eef1f5; }
  .bar { background: #1d2733; color: #fff; padding: 10px 14px; display: flex; gap: 8px;
         flex-wrap: wrap; align-items: center; }
  .bar a, .bar button { background: #334152; color: #fff; border: none; border-radius: 7px;
         padding: 6px 11px; font: inherit; text-decoration: none; cursor: pointer; }
  .bar a.on { background: #2f6df6; }
  .bar .lbl { opacity: .7; margin-right: 2px; }
  .stage { max-width: 780px; margin: 18px auto; padding: 0 12px; }
  #mock-log { background: #101418; color: #9fe0a8; font: 12px/1.5 ui-monospace, monospace;
         border-radius: 10px; padding: 12px; max-height: 220px; overflow: auto;
         white-space: pre-wrap; margin: 18px 0; }
</style>
</head>
<body>
<div class="bar">
  <span class="lbl">Scenario:</span>
  <a href="?s=wizard">wizard</a>
  <a href="?s=day0">day0 ready</a>
  <a href="?s=day1_fresh">day1 fresh</a>
  <a href="?s=day1_scores">day1 scores</a>
  <a href="?s=day5">day5 daily</a>
  <a href="?s=day9">day9 progress</a>
  <a href="?s=multi">multi-project</a>
  <a href="?s=milestone">milestone</a>
  <a href="?s=decided">decided</a>
  <a href="?s=settingup">setting-up poll</a>
  <button id="sim-rbf">Simulate coach handoff (RBF)</button>
  <button id="sim-fna">…(Fear &amp; Anxiety)</button>
  <button id="sim-apply">Simulate coach apply</button>
</div>

<div class="stage">
  <!-- Same stub a Systeme lesson carries. This repo is PUBLIC: the stub ships
       EMPTY, like the live /freedom/start page. For live draft-bot mounting,
       hand-fill data-engine/data-key locally and never commit the values
       (Gateway calls stay mocked either way). -->
  <div id="freedom-home"
       data-engine=""
       data-key=""
       data-draft="1"
       data-full-tracker-url="https://example.com/full-tracker-lesson"></div>
  <pre id="mock-log">mock log —\n</pre>
</div>

<script>
(function () {
  // Seed the shared device token so coach.v3 boots deterministically: with
  // no token AND no identity (the /api/ fetches are rejected here), its
  // attemptRecover() renders "Almost ready" without ever touching the
  // network — a fresh browser profile would make the coach vanish from
  // this harness. The stub ignores token values.
  try { localStorage.setItem('ag_ft_token', 'tok-harness'); } catch (e) {}

  var qs = new URLSearchParams(location.search);
  var scenario = qs.get('s') || 'wizard';
  document.querySelectorAll('.bar a').forEach(function (a) {
    if (a.getAttribute('href') === '?s=' + scenario) a.className = 'on';
  });

  // Synced to the Gateway's baked COPY.SCORE_QUESTIONS (stress test 2026-08
  // finding 9: the mock had drifted cleaner than production, so walks were
  // proofing different daily words than students get — §4.5 rule).
  var SCORE_QUESTIONS = {
    easy: 'How easy / no-big-deal is it right now to NOT do your UB? (0-10)',
    enjoy: 'How enjoyable is it right now to not do it / be free from it? (0-10)',
    conf: 'How confident are you that you can rewire your brain for greater freedom? (0-10)'
  };
  var DAY1_LABELS = {
    d1_t1: 'No-Brainer Willpower Eliminator', d1_t2: 'Minimalist Plan',
    d1_t3: 'Feel Good Start', d1_t4: 'Create Joyous Chaos',
    d1_withdrawal: 'Withdrawal Helper (optional)'
  };
  var DAILY_LABELS = {
    jumpstart: 'I did the Happiness & Success Jumpstart today',
    rbf: 'I used the Rapid Behavioral Freedom tool and/or Fear & Anxiety tool for this many minutes today (0 if unused)',
    exp: 'Real-World Freedom Experiments: what I did to skip or delay my UB',
    wins: 'Wins: what felt easier or different today? Any other wins?',
    opps: 'Opportunities or Concerns: tempting moments, challenges, slip-ups…',
    notes: 'Anything else worth noting today? (Optional. The AI Coach does not read this.)'
  };

  // ---- mutable model per scenario ----
  var M = {
    stage: 4, currentDay: 5, ub: 'late-night doomscrolling', jumpstart: '7am, while my coffee brews',
    day1: { d1_t1: true, d1_t2: true, d1_t3: true, d1_t4: true, d1_withdrawal: false },
    afterPh: true,
    daily: {},   // per-day: {jumpstart, rbf, exp, wins, opps, notes, scores:{easy,enjoy,conf}}
    progress: null
  };
  if (scenario === 'wizard') { M.stage = 0; M.currentDay = 0; M.ub = ''; M.jumpstart = ''; M.day1 = { d1_t1:false,d1_t2:false,d1_t3:false,d1_t4:false,d1_withdrawal:false }; M.afterPh = false; }
  // Round 17: post-wizard, pre-start — the "Getting ready" state under the
  // day1Date anchor (currentDay stays 0 until the first day-1 save).
  if (scenario === 'day0') { M.currentDay = 0; M.day1 = { d1_t1:false,d1_t2:false,d1_t3:false,d1_t4:false,d1_withdrawal:false }; M.afterPh = false; }
  if (scenario === 'day1_fresh') { M.currentDay = 1; M.day1 = { d1_t1:false,d1_t2:false,d1_t3:false,d1_t4:false,d1_withdrawal:false }; M.afterPh = false; }
  if (scenario === 'day1_scores') { M.currentDay = 1; M.afterPh = false; }
  if (scenario === 'day5') { M.currentDay = 5; }
  if (scenario === 'day9') {
    M.currentDay = 9;
    // REAL Gateway shapes (GatewayReflections): baseline/current are FLAT
    // values; fromBaseline + last7.deltas are {from,to,change} OBJECTS;
    // wins is {items:[{day,text}], total}. Keep this mirroring reality —
    // flat-number deltas here once hid a "[object Object]" bug.
    M.progress = { ok: true, currentDay: 9, baseline: { easy: 2, enjoy: 1, conf: 3 }, baselineLabel: 'Baseline',
      current: { easy: 6, enjoy: 5, conf: 7 }, currentLabel: 'Day 8', hasData: true,
      fromBaseline: { easy: { from: 2, to: 6, change: 4 }, enjoy: { from: 1, to: 5, change: 4 }, conf: { from: 3, to: 7, change: 4 } },
      last7: { fromLabel: 'Day 2', deltas: { easy: { from: 4, to: 6, change: 2 }, enjoy: { from: 2, to: 5, change: 3 }, conf: { from: 6, to: 7, change: 1 } } },
      wins: { items: [
        { day: 8, text: 'Read a whole chapter in bed, phone stayed in the kitchen' },
        { day: 6, text: 'Evening felt lighter, no pull after dinner' },
        { day: 4, text: 'Noticed the urge, watched it pass without acting' }
      ], total: 7 },
      // Round 15: day9 deliberately has NO exps — it forces the empty-state
      // teach line (+ the Day 7–9 proof headline). The milestone scenario
      // carries the full exps stack (round-12 shape: {items,total}).
      exps: { items: [], total: 0 } };
  }
  if (scenario === 'multi') {
    M.currentDay = 5;
    M.projects = [{ projectId: '1', label: 'late-night doomscrolling' }, { projectId: '2', label: 'sugar after dinner' }];
    M.canCreate = true;
    // Round 18: one pre-archived project so the picker's restore door is
    // visible on load; archiving live adds to this list.
    M.archivedList = [{ projectId: '9', label: 'an old finished behavior' }];
  }
  // Round 14 forcing scenarios (State Map): the milestone watcher fires /
  // a decision already exists. Shapes mirror the REAL Gateway exactly:
  // progressReview.milestone {eligible,easy,enjoy} + .decision {day,date};
  // state.milestoneDecision {day,date}|null.
  if (scenario === 'milestone' || scenario === 'decided') {
    M.currentDay = 16;
    if (scenario === 'decided') { M.nblcd = { day: 15, date: '2026-07-20' }; }
    M.progress = { ok: true, currentDay: 16, baseline: { easy: 2, enjoy: 1, conf: 3 }, baselineLabel: 'Baseline',
      current: { easy: 8, enjoy: 7, conf: 9 }, currentLabel: 'Day 15', hasData: true,
      fromBaseline: { easy: { from: 2, to: 8, change: 6 }, enjoy: { from: 1, to: 7, change: 6 }, conf: { from: 3, to: 9, change: 6 } },
      wins: { items: [{ day: 15, text: 'Walked past the dessert bar without a second thought' }], total: 9 },
      exps: { items: [{ day: 14, text: 'Sat with coffee instead of the pastry — easy' }], total: 6 },
      milestone: { eligible: true, easy: 8, enjoy: 7 },
      decision: M.nblcd || null };
  }
  if (scenario === 'settingup') {
    // Fresh buyer beat the webhook: state fails, recover says notFound twice,
    // then the tracker "appears" and the poll grants a token -> wizard.
    M.stage = 0; M.currentDay = 0; M.ub = ''; M.jumpstart = '';
    M._granted = false; M._notFoundLeft = 2;
  }

  function logLine(s) {
    var el = document.getElementById('mock-log');
    el.textContent += s + '\n';
    el.scrollTop = el.scrollHeight;
  }

  function dayResp(day) {
    var fields = [];
    if (day === 0) {
      fields = [
        { key: 'd0_all', label: 'I understand…and I’m looking forward to the rewiring!', type: 'check', value: false },
        // Round 19: the mock STORES the plan (the real tracker does) — the
        // collapsed "My plan: …" line depends on the read-back.
        { key: 'd0_ph_plan', label: 'My Day 1 Freedom Power Hour time and place:', type: 'text', value: M.d0plan || '' }
      ];
      return { day: 0, title: 'Day 0', fields: fields };
    }
    if (day === 1) {
      Object.keys(M.day1).forEach(function (k) {
        fields.push({ key: k, label: DAY1_LABELS[k], type: 'check', value: M.day1[k] });
      });
      return { day: 1, title: 'Day 1: Freedom Power Hour Check-In', fields: fields,
        scores: { label: 'After Power Hour', questions: SCORE_QUESTIONS, values: {} } };
    }
    var d = M.daily[day] || {};
    Object.keys(DAILY_LABELS).forEach(function (k) {
      var type = (k === 'jumpstart') ? 'check' : (k === 'rbf' ? 'number' : 'textarea');
      fields.push({ key: k, label: DAILY_LABELS[k], type: type, value: (d[k] == null ? (type === 'check' ? false : '') : d[k]) });
    });
    return { day: day, title: 'Day ' + day + ': Daily Check-In', fields: fields,
      scores: { label: 'Day ' + day + ' Freedom Scores', questions: SCORE_QUESTIONS, values: d.scores || {} } };
  }
  function completionMap() {
    var c = { 0: true, 1: (M.day1.d1_t1 && M.day1.d1_t2 && M.day1.d1_t3 && M.day1.d1_t4 && M.afterPh) };
    for (var d = 2; d <= M.currentDay; d++) c[d] = !!(M.daily[d] && M.daily[d].jumpstart);
    return c;
  }
  function stateResp() {
    var plist = M.projects || [{ projectId: '1', label: 'Test project' }];
    var pid = String(M.activeId || plist[0].projectId);
    // Desync-fix ratchet (2026-07-27): per-project day + ub, SAME rule the
    // coach stub uses (first project = M.currentDay, others = Day 2) — the
    // real Gateway serves both surfaces from one state action, so the
    // harness must never show the rail one project's numbers and the coach
    // another's. Non-multi scenarios (no M.projects) are untouched.
    var cur = null;
    for (var si = 0; si < plist.length; si++) {
      if (String(plist[si].projectId) === pid) { cur = plist[si]; }
    }
    // Unknown project (stale pin from another scenario): behave like the
    // real Gateway — fall back to a project that exists, and SAY so via
    // activeProjectId, never echo a ghost id with someone else's data.
    if (!cur) { cur = plist[0]; pid = String(cur.projectId); M.activeId = pid; }
    var cday = (String(cur.projectId) === String(plist[0].projectId)) ? M.currentDay : 2;
    var ub = (M.projects && cur.label) ? cur.label : M.ub;
    return { ok: true, firstName: 'Testy', token: 'mock-token',
      projects: plist,
      activeProjectId: pid,
      projectType: 'ACCELERATOR', currentDay: cday, maxDay: 7, maxTrackedDay: 400,
      writable: true, unlimited: !!M.canCreate, canCreateProject: !!M.canCreate,
      archived: M.archivedList || [],
      confidence: { optedOut: false, since: '' },
      milestoneDecision: M.nblcd || null,
      setup: { stage: M.stage, ub: ub, jumpstart: M.jumpstart },
      scoreQuestions: SCORE_QUESTIONS, prompts: {}, uiCopy: {},
      day: (M.stage >= 4 ? dayResp(cday) : null), completion: (M.stage >= 4 ? completionMap() : null) };
  }

  // REAL coach.v3 UI, driven by a fetch stub (pattern lifted from
  // test_coach_home.html). Only the Gateway deployment is intercepted —
  // the widget's engine calls (a different deployment id) pass through to
  // the live draft engine. Home's own calls use __FH_MOCK_CALL, not fetch.
  var GATEWAY_ID = 'AKfycbxokJhAPaX6';
  var realFetch = window.fetch;
  window.fetch = function (url, opts) {
    var u = String(url);
    if (u.indexOf(GATEWAY_ID) >= 0) {
      var p = {};
      try { p = JSON.parse((opts && opts.body) || '{}'); } catch (e) {}
      logLine('→ coach ' + p.action + (p.home ? ' home=true' : ''));
      var resp = coachRoute(p);
      // coachApply is slowed so the typed "Saving a …" verbs are visible
      // (round 16) — the real Gateway takes about this long anyway.
      var delay = (p.action === 'coachApply') ? 700 : 0;
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve({ ok: true, json: function () { return Promise.resolve(resp); } });
        }, delay);
      });
    }
    if (u.indexOf('/api/') >= 0) { return Promise.reject(new Error('no identity in harness')); }
    return realFetch.apply(window, arguments);
  };
  function coachRoute(p) {
    if (p.action === 'state') {
      // Desync-fix ratchet (2026-07-27): this stub used to pin
      // activeProjectId '1' no matter what the coach asked for — which is
      // exactly why twenty rounds of harness walks never caught the
      // rail↔coach project desync. It now behaves like the real Gateway:
      // echo the requested project, fall back to the rail mock's shared
      // M.activeId, and serve the SAME project list the rail sees when the
      // scenario defines one (multi). Non-multi scenarios keep the tall
      // 3-project picker (the round-3 phone-overflow regression guard).
      var plist = (M.projects ||
        [{ projectId: '1', label: 'late-night doomscrolling' },
         { projectId: '2', label: 'sugar after dinner' },
         { projectId: '3', label: 'cruise-ship eating' }]
      ).map(function (pr, pi) {
        // The real Gateway ships currentDay + day0Date per project (the
        // coach picker's "Project N (Day D)" naming depends on both).
        return { projectId: pr.projectId, label: pr.label,
          currentDay: (pi === 0 ? M.currentDay : 2),
          day0Date: '2026-07-0' + (pi + 1) };
      });
      var pid = String(p.projectId || M.activeId || plist[0].projectId);
      var known = null;
      for (var ci = 0; ci < plist.length; ci++) {
        if (String(plist[ci].projectId) === pid) { known = plist[ci]; }
      }
      if (!known) { pid = String(plist[0].projectId); known = plist[0]; }
      // Per-project day so a desynced coach is VISIBLE in the harness
      // (subline says Day 5 on project 1, Day 2 on any other).
      var cday = known.currentDay;
      logLine('   coach scoped to project ' + pid);
      return { ok: true, activeProjectId: pid, firstName: 'Testy', currentDay: cday, maxDay: 7,
        writable: true,
        projects: plist,
        setup: { ub: known.label || M.ub || 'late-night doomscrolling' }, uiCopy: {} };
    }
    if (p.action === 'recover') { return { ok: true, token: 'tok-harness' }; }
    if (p.action === 'coachRecommend') {
      return { ok: true,
        message: 'Day ' + M.currentDay + ' — your evenings keep coming up. Load this into your Rapid Behavioral Freedom tool. Send it in, then add your own words about what is going on right now.',
        prompt: 'I want to make it easier and more enjoyable to not do the following behavior: late-night doomscrolling. The thought that comes up is "just five minutes". Help me rewire it.',
        tool: 'Rapid Behavioral Freedom tool' };
    }
    if (p.action === 'coachChat') {
      // Round 11: a win-shaped message comes back with a log proposal so the
      // auto-apply chip (payoff copy) is testable alongside conversation mode.
      var lastMsg = '';
      try { lastMsg = p.messages[p.messages.length - 1].text; } catch (e) {}
      // Challenge-shaped → an OPPORTUNITIES proposal WITH a previous value
      // (round 16: verifies the rewiring-opportunity chip family + Undo).
      if (/challeng|struggl|stress/i.test(lastMsg)) {
        return { ok: true,
          message: 'That moment is workable — saving it as a rewiring opportunity.',
          proposal: { summary: 'Add to Opportunities', updates: [{
            field: 'opportunities', label: 'Opportunities', day: M.currentDay, mode: 'append',
            current: 'earlier note about evenings',
            addedText: lastMsg.slice(0, 80),
            finalText: 'earlier note about evenings\n' + lastMsg.slice(0, 80) }] } };
      }
      if (/win|donut|success/i.test(lastMsg)) {
        return { ok: true,
          message: 'That is a great win — noticing the pull fade is rewiring at work.',
          proposal: { summary: 'Add to Wins', updates: [{
            field: 'wins', label: 'Wins', day: M.currentDay, mode: 'append',
            current: '', addedText: lastMsg.slice(0, 80), finalText: lastMsg.slice(0, 80) }] } };
      }
      return { ok: true, message: 'Heard. Logging that quietly. What felt easier today?' };
    }
    if (p.action === 'coachApply') { return { ok: true, applied: ['wins'], failed: [] }; }
    if (p.action === 'coachBuildPrompt') {
      return { ok: true,
        message: 'Built from what you picked.',
        prompt: 'I want to make it easier and more enjoyable to not do: late-night doomscrolling. To make this easier I want to stop feeling ' + (p.feeling || 'tempted') + '. Situation: ' + (p.text || '(none)') + '.',
        tool: 'Rapid Behavioral Freedom tool' };
    }
    if (p.action === 'coachHelpMenu') {
      return { ok: true, ub: M.ub || 'doomscrolling', feelings: [
        { key: 'overwhelm', label: 'Overwhelmed', group: 'Feelings' },
        { key: 'fear', label: 'Fear & anxiety', group: 'Feelings' },
        { key: 'bored', label: 'Bored / restless', group: 'Cravings' }
      ] };
    }
    return { ok: false, error: 'stub: unhandled ' + p.action };
  }
  window.__FH_MOCK_CALL = function (p) {
    var summary = p.action + (p.day != null ? ' day=' + p.day : '') + (p.step ? ' step=' + p.step : '');
    if (p.fields) summary += ' fields=' + JSON.stringify(p.fields);
    if (p.dayScores) summary += ' dayScores=' + JSON.stringify(p.dayScores);
    if (p.scores) summary += ' scores=' + JSON.stringify(p.scores);
    if (p.confidentForever) summary += ' confidentForever=true';
    if (p.fresh) summary += ' fresh=true';
    if (p.projectId != null) summary += ' pid=' + p.projectId;
    logLine('→ ' + summary);

    if (p.action === 'state') {
      if (scenario === 'settingup' && !M._granted) return { ok: false, error: 'Unknown token.' };
      if (p.projectId) M.activeId = String(p.projectId);
      return stateResp();
    }
    if (p.action === 'recover') {
      if (scenario === 'settingup') {
        if (M._notFoundLeft > 0) { M._notFoundLeft--; return { ok: true, notFound: true }; }
        M._granted = true;
        return { ok: true, token: 'mock-token' };
      }
      return { ok: true, token: 'mock-token' };
    }
    if (p.action === 'renameProject') {
      // Round 20 mirror: rename sets the label AND locks it — the mock's
      // ub-save label write skips locked pids, like the real Gateway.
      M.projects = M.projects || [{ projectId: '1', label: 'Test project' }];
      M.renamedLock = M.renamedLock || {};
      for (var rni = 0; rni < M.projects.length; rni++) {
        if (String(M.projects[rni].projectId) === String(p.projectId)) {
          M.projects[rni].label = String(p.label || '').substring(0, 40);
          M.renamedLock[String(p.projectId)] = true;
          break;
        }
      }
      return { ok: true, projects: M.projects, archived: M.archivedList || [], label: String(p.label || '') };
    }
    if (p.action === 'archiveProject') {
      // Round 18 mirror: refuse the last active project; move to archived;
      // activeProjectId = the remaining default.
      M.projects = M.projects || [{ projectId: '1', label: 'Test project' }];
      if (M.projects.length <= 1) return { ok: false, error: 'This is your only active project, so it can’t be archived.' };
      M.archivedList = M.archivedList || [];
      for (var ai = 0; ai < M.projects.length; ai++) {
        if (String(M.projects[ai].projectId) === String(p.projectId)) {
          M.archivedList.push(M.projects[ai]);
          M.projects.splice(ai, 1);
          break;
        }
      }
      M.activeId = M.projects[0].projectId;
      return { ok: true, projects: M.projects, archived: M.archivedList, activeProjectId: M.activeId };
    }
    if (p.action === 'unarchiveProject') {
      M.archivedList = M.archivedList || [];
      for (var ui = 0; ui < M.archivedList.length; ui++) {
        if (String(M.archivedList[ui].projectId) === String(p.projectId)) {
          M.projects.push(M.archivedList[ui]);
          M.archivedList.splice(ui, 1);
          break;
        }
      }
      M.activeId = String(p.projectId);
      return { ok: true, projects: M.projects, archived: M.archivedList, activeProjectId: M.activeId };
    }
    if (p.action === 'createProject') {
      // Round 18: ?fail=create forces the HONEST failure path (mirrors the
      // server's no-new-project-after-re-read error with its detail field).
      if (qs.get('fail') === 'create') {
        return { ok: false,
          error: 'Your project was set up but hasn’t appeared on your account yet. Give it a moment, then check your project menu or tap Create once more.',
          detail: 'post-create re-read found no new project (before=2, after=2, webhook masterRow=99)' };
      }
      // REAL Gateway shape (round 17): {ok, projects, activeProjectId,
      // projectId} — activeProjectId names the NEW project explicitly.
      // WARNING (doctrine §4.5): the old mock returned ONLY {ok, projectId};
      // freedom-home read data.projectId, the real server sent activeProjectId
      // (which round-13's pickProject_ pointed at the FINISHED project), and
      // creation live-landed Dave back on his Day-14 project. This mock hid
      // that bug. Mirror the real response, always.
      M.projects = M.projects || [{ projectId: '1', label: 'Test project' }];
      M.projects.push({ projectId: '3', label: 'New project (setting up)' });
      M.activeId = '3'; M.stage = 0; M.currentDay = 0; M.ub = ''; M.jumpstart = '';
      M.day1 = { d1_t1: false, d1_t2: false, d1_t3: false, d1_t4: false, d1_withdrawal: false };
      M.afterPh = false;
      return { ok: true, projects: M.projects, activeProjectId: '3', projectId: '3' };
    }
    if (p.action === 'getDay') return { ok: true, activeProjectId: '1', day: dayResp(Number(p.day)) };
    if (p.action === 'setupSave') {
      if (p.step === 'ub') {
        M.ub = p.ub; M.stage = Math.max(M.stage, 1);
        // Mirror the server: the ub save also writes the dropdown label —
        // unless a manual rename locked it (round 20).
        var lst = M.projects || [];
        var lockMap = M.renamedLock || {};
        for (var li = 0; li < lst.length; li++) {
          if (String(lst[li].projectId) === String(M.activeId || '1')) {
            if (!lockMap[String(lst[li].projectId)]) { lst[li].label = M.ub; }
            break;
          }
        }
        return { ok: true, stage: M.stage, ub: M.ub };
      }
      if (p.step === 'baseline') { M.baseline = p.scores || null; M.stage = Math.max(M.stage, 2); return { ok: true, stage: M.stage }; }
      if (p.step === 'jumpstart') { M.jumpstart = p.jumpstart; M.stage = Math.max(M.stage, 3); return { ok: true, stage: M.stage, jumpstart: M.jumpstart }; }
      if (p.step === 'complete') { M.stage = 4; return { ok: true, stage: 4, currentDay: M.currentDay, day: dayResp(M.currentDay), completion: completionMap() }; }
    }
    if (p.action === 'save') {
      var day = Number(p.day);
      if (day === 1) {
        Object.keys(p.fields || {}).forEach(function (k) { if (k in M.day1) M.day1[k] = !!p.fields[k]; });
        if (p.dayScores && (p.dayScores.easy != null)) {
          M.afterPh = true;
          // Phase 2 (fable polish): the real Gateway's progressReview carries
          // baseline + the just-saved after-PH scores — mirror it so the
          // celebrate card's delta line is forceable (§4.9). A walk that
          // never saved a baseline (day1_scores scenario) builds no deltas,
          // and the card renders no line — that absence is the other case.
          var fb = {};
          ['easy', 'enjoy', 'conf'].forEach(function (k) {
            var b = M.baseline ? M.baseline[k] : null;
            var c = p.dayScores[k];
            if (b != null && c != null) fb[k] = { from: b, to: c, change: c - b };
          });
          M.progress = { ok: true, currentDay: M.currentDay || 1, hasData: true,
            baseline: M.baseline || { easy: null, enjoy: null, conf: null }, baselineLabel: 'Baseline',
            current: p.dayScores, currentLabel: 'After Power Hour',
            fromBaseline: fb,
            wins: { items: [], total: 0 }, exps: { items: [], total: 0 } };
        }
        // Round 17 (mirror the real Gateway): the FIRST day-1 save stamps
        // day1Date server-side — currentDay flips 0 → 1 and the save
        // response carries currentDay so the chip updates immediately.
        if (M.currentDay === 0) { M.currentDay = 1; }
      } else if (day === 0) {
        if (p.fields && 'd0_ph_plan' in p.fields) { M.d0plan = String(p.fields.d0_ph_plan || ''); }
      } else {
        var d = M.daily[day] = M.daily[day] || {};
        Object.keys(p.fields || {}).forEach(function (k) { d[k] = (k === 'jumpstart') ? !!p.fields[k] : p.fields[k]; });
        if (p.dayScores) d.scores = p.dayScores;
      }
      return { ok: true, saved: Object.keys(p.fields || {}), failed: [], currentDay: M.currentDay, day: dayResp(day), completion: completionMap() };
    }
    if (p.action === 'updateGoals') {
      M.ub = p.ub; M.jumpstart = p.jumpstart;
      return { ok: true, ub: p.ub, jumpstart: p.jumpstart };
    }
    if (p.action === 'progressReview') return M.progress || { ok: true, hasData: false };
    if (p.action === 'nblcdSave') {
      M.nblcd = { day: M.currentDay, date: '2026-07-21' };
      if (M.progress) { M.progress.decision = M.nblcd; }
      return { ok: true, decision: M.nblcd };
    }
    if (p.action === 'activate') return { ok: true, token: 'mock-token' };
    return { ok: false, error: 'mock: unhandled action ' + p.action };
  };

  // Simulated coach handoff (what coach.v3's button dispatches).
  function sim(tool) {
    var prompt = 'Today I feel tempted in the late evening. The thought "just five minutes won\'t hurt" keeps coming up. ' +
      'My unwanted behavior is late-night doomscrolling. Help me rewire this with the counter that five minutes is never five minutes, ' +
      'and the reversal that my phone charges outside the bedroom either way.';
    var ev;
    try { ev = new CustomEvent('fc:prompt-send', { detail: { prompt: prompt, tool: tool } }); }
    catch (e) { ev = document.createEvent('CustomEvent'); ev.initCustomEvent('fc:prompt-send', false, false, { prompt: prompt, tool: tool }); }
    document.dispatchEvent(ev);
    logLine('→ dispatched fc:prompt-send (' + tool + ')');
  }
  document.getElementById('sim-rbf').onclick = function () { sim('Rapid Behavioral Freedom tool'); };
  document.getElementById('sim-fna').onclick = function () { sim('Fear & Anxiety Relief tool, then the Rapid Behavioral Freedom tool'); };

  // test_home_lesson.html (fake Systeme parent) drives the sims from ITS bar
  // while the fullscreen rail covers ours. postMessage keeps the dispatch in
  // THIS document, where freedom-home listens.
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || !d.fhSim) return;
    if (d.fhSim === 'rbf') { sim('Rapid Behavioral Freedom tool'); }
    if (d.fhSim === 'fna') { sim('Fear & Anxiety Relief tool, then the Rapid Behavioral Freedom tool'); }
    if (d.fhSim === 'apply') { document.getElementById('sim-apply').onclick(); }
  });

  // What coach.v3 dispatches after a review-card apply succeeds. The mock
  // "writes" a win first, so the getDay refetch has something to show.
  document.getElementById('sim-apply').onclick = function () {
    var d = M.daily[M.currentDay] = M.daily[M.currentDay] || {};
    d.wins = '(logged by your coach) Evening felt lighter without the scroll';
    var ev;
    try { ev = new CustomEvent('fc:applied', { detail: { updates: [{ field: 'wins' }] } }); }
    catch (e) { ev = document.createEvent('CustomEvent'); ev.initCustomEvent('fc:applied', false, false, {}); }
    document.dispatchEvent(ev);
    logLine('→ dispatched fc:applied (mock wrote wins)');
  };

  // Load the widget first (real Pages copy not needed locally — use the repo sibling), then freedom-home.
  var w = document.createElement('script');
  w.src = '../ai_tools/widget/ai-tools-widget.v1.js?ts=' + Date.now();
  w.onload = function () {
    var s = document.createElement('script');
    s.src = './freedom-home.v1.js?ts=' + Date.now();
    document.body.appendChild(s);
  };
  document.body.appendChild(w);
})();
</script>
